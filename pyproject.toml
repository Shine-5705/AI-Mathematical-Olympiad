[project]
name = "ai-mathematical-olympiad"
version = "0.1.0"
description = "MCTS-based math solver with symbolic verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0.0",
    "fastparquet>=2024.0.0",
    "fsspec>=2024.0.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.0.0",
    "sympy>=1.12.0",
    "torch>=2.0.0",
    "tqdm>=4.66.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
mac = ["mlx-lm>=0.19.0"]
cuda = ["vllm>=0.6.0"]
